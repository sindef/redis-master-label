apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-leader
  namespace: default
spec:
  replicas: 1
  # A single Redis master must never have two pods. Master election here is by
  # label, not by a leader-election loop: whichever pod's redis-server reports
  # role:master gets redis-role=master from its sidecar, and the redis-leader
  # Service selects every pod carrying app: redis-leader, which is also the DNS
  # name the replica deployment replicates from. RollingUpdate (the default when
  # no strategy is set) creates the replacement pod before terminating the old
  # one, and a fresh redis-server starts with no --replicaof, so both pods would
  # be masters: the Service would route the replicas across two divergent
  # datasets and both sidecars would label their own pod master. Recreate
  # terminates the old pod before the replacement starts, so at most one
  # redis-leader pod exists at any moment (expect a short write outage while the
  # new pod starts). TestLeaderDeploymentUsesRecreateStrategy fails when this
  # strategy is lost.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis-leader
  template:
    metadata:
      labels:
        app: redis-leader
    spec:
      serviceAccountName: redis-master-label
      # The redis container below is forced to runAsUser 10001, but the
      # redis:7-alpine image's own user is redis (uid 999), so the kubelet has no
      # owner to give the redis-data emptyDir: without this pod-level fsGroup it
      # creates /data owned by root:root with mode 0755, redis-server runs as
      # uid 10001 and every background RDB save fails with EACCES, so the leader
      # silently loses persistence. fsGroup 10001 gives the volume to that group
      # and adds it to the container's supplementary groups, which is what makes
      # the mount writable for the declared user. Keep it equal to the redis
      # container's runAsUser/runAsGroup; the manifest test fails otherwise.
      securityContext:
        fsGroup: 10001
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        # Same as deployment-example.yaml: requests size the pod for the
        # scheduler and limits cap what the single leader can take from the
        # node, so the pod is Burstable instead of BestEffort. Size these from
        # real usage (kubectl top pod) and the dataset Redis holds.
        # TestManifestContainersDeclareResources fails when either half is lost.
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        # Same as deployment-example.yaml: redis-server persists its RDB
        # snapshot under /data, and the read-only root filesystem below makes
        # the emptyDir mount the only place it can write.
        volumeMounts:
        - name: redis-data
          mountPath: /data
        # Same as deployment-example.yaml: the restricted Pod Security Standard
        # is evaluated per container, so this container needs its own profile
        # even though the labeler beside it declares one.
        # TestExampleManifestsEveryContainerMeetsRestrictedStandard fails when
        # any container of either example deployment loses a field.
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        # The labeler sidecar below reads REDIS_PASSWORD from the redis-secret
        # Secret and sends it with AUTH. redis-server used to start with no
        # arguments, so it listened without a password while the sidecar sent
        # one: Redis replied "ERR Client sent AUTH, but no password is set",
        # ROLE never succeeded, /healthz answered 503 and the liveness probe
        # restarted the sidecar. The server now requires the same Secret value.
        # TestManifestRedisAuthMatchesSidecarCredential fails when the redis
        # container's credential and the sidecar's disagree.
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: password
        # $(REDIS_PASSWORD) is expanded by the kubelet from the env entry above,
        # so the credential itself never lands in the pod spec.
        command:
        - redis-server
        - --requirepass
        - $(REDIS_PASSWORD)
      - name: redis-master-label
        # Same as deployment-example.yaml: pinned versioned release image,
        # never a floating :latest reference.
        image: ghcr.io/redis-master-label/redis-master-label:v0.1.0
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # Same as deployment-example.yaml: the password arrives through the
        # REDIS_PASSWORD env var from a Secret, never through args
        # (TestManifestSidecarsKeepPasswordOutOfArgs fails when a sidecar arg
        # carries the credential).
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: password
        command:
        - /app/redis-master-label
        - --redis-addr=localhost:6379
        - --label-key=redis-role
        - --label-value=master
        - --check-interval=10s
        # Same as deployment-example.yaml: the documented /healthz endpoint
        # (main.go binds --health-port 8080) is polled by a liveness and a
        # readiness probe, so a labeler whose Redis became unreachable is
        # restarted instead of staying Running with a stale redis-role label.
        # TestManifestSidecarsDeclareHealthProbes fails when the health port is
        # declared without a probe polling /healthz on it.
        # Same as deployment-example.yaml: a request gives the scheduler a size
        # to pack the pod by (Burstable, not BestEffort, so it is not evicted
        # first under node pressure) and the limit keeps the 10s poll loop from
        # taking the whole node when Redis stalls.
        # TestManifestContainersDeclareResources fails when either half is lost.
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        ports:
        - name: health
          containerPort: 8080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        # Same as deployment-example.yaml: the labeler needs no privileges
        # (it only reads Redis and calls the Kubernetes API with its mounted
        # credentials), so it runs as the image's non-root uid, cannot write
        # its root filesystem, cannot gain privileges and drops every
        # capability. This is what namespaces enforcing the restricted Pod
        # Security Standard require.
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: redis-data
        # Holds redis-server's RDB snapshot. emptyDir is writable by the
        # container's uid, so the container keeps a read-only root filesystem.
        # Swap in a PersistentVolumeClaim if the leader must keep its data
        # across a pod restart.
        emptyDir: {}
