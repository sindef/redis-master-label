apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-leader
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-leader
  template:
    metadata:
      labels:
        app: redis-leader
    spec:
      serviceAccountName: redis-master-label
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        command:
        - redis-server
      - name: redis-master-label
        image: redis-master-label:latest
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        command:
        - /app/redis-master-label
        - --redis-addr=localhost:6379
        - --label-key=redis-role
        - --label-value=master
        - --check-interval=10s
