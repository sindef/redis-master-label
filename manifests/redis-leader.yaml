apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-leader
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-leader
  template:
    metadata:
      labels:
        app: redis-leader
    spec:
      serviceAccountName: redis-master-label
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        command:
        - redis-server
      - name: redis-master-label
        # Same as deployment-example.yaml: pinned versioned release image,
        # never a floating :latest reference.
        image: ghcr.io/redis-master-label/redis-master-label:v0.1.0
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # Same as deployment-example.yaml: the password arrives through the
        # REDIS_PASSWORD env var from a Secret, never through args.
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: password
        command:
        - /app/redis-master-label
        - --redis-addr=localhost:6379
        - --label-key=redis-role
        - --label-value=master
        - --check-interval=10s
