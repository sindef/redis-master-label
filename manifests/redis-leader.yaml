apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-leader
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-leader
  template:
    metadata:
      labels:
        app: redis-leader
    spec:
      serviceAccountName: redis-master-label
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        command:
        - redis-server
      - name: redis-master-label
        # Published by .github/workflows/release.yml when a vX.Y.Z tag is
        # pushed. Pin a registry-qualified, versioned tag so the image is
        # pullable (an unqualified name defaults to docker.io and :latest
        # forces re-pull/rebuild) and so a bad release can be rolled back.
        image: ghcr.io/redis-master-label/redis-master-label:v0.1.0
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        command:
        - /app/redis-master-label
        - --redis-addr=localhost:6379
        - --label-key=redis-role
        - --label-value=master
        - --check-interval=10s
