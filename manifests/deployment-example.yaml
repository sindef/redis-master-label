apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-with-labeler
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      serviceAccountName: redis-master-label
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        command:
        - redis-server
        - --replicaof
        - "redis-leader.default.svc.cluster.local"
        - "6379"
      - name: redis-master-label
        # Pinned to a registry-qualified versioned release, never :latest:
        # a floating tag makes every deployment's image depend on the newest
        # published build instead of the tested one, and `latest` pulled once
        # as an empty registry reference caused the original ImagePullBackOff.
        # Roll back by redeploying the previous tag.
        image: ghcr.io/redis-master-label/redis-master-label:v0.1.0
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # The password comes from a Secret through valueFrom.secretKeyRef, not
        # from args: an --redis-password argument lands in the pod spec and in
        # /proc/<pid>/cmdline, readable by anyone who can inspect the pod.
        # Create the secret first (see README "Kubernetes deployment").
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: password
        command:
        - /app/redis-master-label
        - --redis-addr=localhost:6379
        - --label-key=redis-role
        - --label-value=master
        - --check-interval=10s
        # The documented health endpoint (README "Health Check Endpoint"): the
        # binary binds --health-port 8080 and serves /healthz, answering 503
        # after 3 consecutive Redis failures. Declaring the port is not enough -
        # the kubelet polls only what a probe names - so without these probes a
        # sidecar whose Redis became unreachable (or whose health listener died)
        # keeps reporting Running and keeps the stale redis-role label.
        # TestManifestSidecarsDeclareHealthProbes fails when the health port is
        # declared without a probe polling /healthz on it. Move the containerPort
        # and both probe ports with --health-port if you change it.
        ports:
        - name: health
          containerPort: 8080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        # The labeler needs no privileges - it only reads Redis and calls the
        # Kubernetes API with its mounted credentials - and works fine with a
        # read-only root filesystem. Without this block the container ran as
        # uid 0 with the image's default (root) user, which namespaces
        # enforcing the restricted Pod Security Standard reject.
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
