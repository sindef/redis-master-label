apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-with-labeler
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      serviceAccountName: redis-master-label
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        # Requests size the pod for the scheduler, limits cap what one replica
        # can take from the node. Without either block the pod runs BestEffort:
        # any node accepts it, it is evicted first under node pressure, and a
        # replica with no maxmemory set can grow until it fills the node.
        # These are small demo sizes; set your own from `kubectl top pod` and
        # the dataset Redis holds. TestManifestContainersDeclareResources fails
        # when a container loses a request or a limit.
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        # redis-server writes its RDB snapshot under /data, so the read-only
        # root filesystem below needs one writable volume. An emptyDir is
        # writable by the container's uid, so persistence does not need a
        # writable root filesystem.
        volumeMounts:
        - name: redis-data
          mountPath: /data
        # The restricted Pod Security Standard is evaluated per container, not
        # per pod: the labeler's securityContext cannot cover this container,
        # so without this block a namespace enforcing the standard rejected the
        # whole pod even though the sidecar passed. Same profile as the sidecar
        # below. TestExampleManifestsEveryContainerMeetsRestrictedStandard fails
        # when any container of either example deployment loses a field.
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        # Start Redis with the same credential the labeler reads, so the AUTH
        # the sidecar sends is accepted. A plain `redis-server` with no
        # --requirepass answers AUTH with "ERR Client sent AUTH, but no
        # password is set", so every ROLE call failed, /healthz answered 503
        # and the liveness probe restarted the sidecar. --masterauth lets the
        # replica authenticate to the leader through the same Secret; without
        # it replication stops with NOAUTH. The value stays out of the pod
        # spec: Kubernetes expands $(REDIS_PASSWORD) from this env var at
        # container start. TestManifestRedisAuthMatchesSidecarCredential fails
        # when the containers stop reading the same Secret and key.
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: password
        command:
        - redis-server
        - --replicaof
        - "redis-leader.default.svc.cluster.local"
        - "6379"
        - --requirepass
        - $(REDIS_PASSWORD)
        - --masterauth
        - $(REDIS_PASSWORD)
      - name: redis-master-label
        # Pinned to a registry-qualified versioned release, never :latest:
        # a floating tag makes every deployment's image depend on the newest
        # published build instead of the tested one, and `latest` pulled once
        # as an empty registry reference caused the original ImagePullBackOff.
        # Roll back by redeploying the previous tag.
        image: ghcr.io/redis-master-label/redis-master-label:v0.1.0
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # The password comes from a Secret through valueFrom.secretKeyRef, not
        # from args: an --redis-password argument lands in the pod spec and in
        # /proc/<pid>/cmdline, readable by anyone who can inspect the pod.
        # TestManifestSidecarsKeepPasswordOutOfArgs fails when a sidecar arg
        # carries the credential.
        # Create the secret first (see README "Kubernetes deployment").
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: password
        command:
        - /app/redis-master-label
        - --redis-addr=localhost:6379
        - --label-key=redis-role
        - --label-value=master
        - --check-interval=10s
        # The documented health endpoint (README "Health Check Endpoint"): the
        # binary binds --health-port 8080 and serves /healthz, answering 503
        # after 3 consecutive Redis failures. Declaring the port is not enough -
        # the kubelet polls only what a probe names - so without these probes a
        # sidecar whose Redis became unreachable (or whose health listener died)
        # keeps reporting Running and keeps the stale redis-role label.
        # TestManifestSidecarsDeclareHealthProbes fails when the health port is
        # declared without a probe polling /healthz on it. Move the containerPort
        # and both probe ports with --health-port if you change it.
        # Sized like the redis container beside it: a request gives the
        # scheduler a size to pack the pod by, so the pod is Burstable instead
        # of BestEffort and is not the first eviction candidate under node
        # pressure, while the limit stops a stalled Redis from letting the 10s
        # poll loop take the whole node. TestManifestContainersDeclareResources
        # fails when either half is lost.
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        ports:
        - name: health
          containerPort: 8080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        # The labeler needs no privileges - it only reads Redis and calls the
        # Kubernetes API with its mounted credentials - and works fine with a
        # read-only root filesystem. Without this block the container ran as
        # uid 0 with the image's default (root) user, which namespaces
        # enforcing the restricted Pod Security Standard reject.
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: redis-data
        # Holds redis-server's RDB snapshot. emptyDir is writable by the
        # container's uid, so the container keeps a read-only root filesystem.
        # Swap in a PersistentVolumeClaim if the replica must keep its data
        # across a pod restart.
        emptyDir: {}
