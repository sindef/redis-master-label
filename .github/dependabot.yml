# Dependabot replaces the Renovate config that lived in renovate.json.
# This repository is hosted on GitHub, so Dependabot needs no app installation
# and the Renovate config never produced a dependency pull request here.
# Security updates stay independent of this file: Dependabot opens security
# pull requests immediately and unscheduled by default.
version: 2

updates:
  # Go module dependencies (go.mod / go.sum).
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Actions used by .github/workflows/ci.yml.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Container base images in the repository's only build file, `Dockerfile`
  # (formerly named `Containerfile`). Dependabot's docker ecosystem only scans
  # Dockerfile file names, so the rename is what makes base-image bumps
  # (for example `alpine:3.24`, `golang:1.26-alpine`) arrive as pull requests.
  # A `golang` bump has to keep the go.mod `go` directive on the same MAJOR.MINOR
  # line: CI's "Check builder toolchain matches go.mod" step and
  # TestDockerfileBuilderToolchainMatchesGoMod fail the pull request when the
  # tag compiles the release binary with a Go version CI does not test with, so
  # a golang base-image bump is only mergeable together with that directive.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
