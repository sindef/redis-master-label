name: Python checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python-checks:
    name: Run Python workflow checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The offline workflow checker's unittest suite. It asserts the checker's
      # own rules (setup-go version source, tabs, leftover gc tokens) against
      # fixture text and re-runs the checker over the workflows this repository
      # ships, so a rule that stopped firing or a shipped workflow that started
      # violating one fails the pull request here. Nothing ran this file before:
      # the build-and-test job's Python step ran ci_check_comments.py and
      # harness.py only.
      - name: Run the workflow checker's unittest suite
        run: python3 test_workflow_checks.py
