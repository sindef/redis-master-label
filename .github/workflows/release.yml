name: Release

# Publishing path for release_hygiene: a vX.Y.Z tag is the single trigger. The
# workflow runs the same tests as CI, builds one image stamped with the tag
# version, and pushes exactly one immutable reference:
# <registry>/<image>:<tag>. Nothing floating like :latest is ever pushed, so
# an image reference stays point-in-time: an old release can be rolled back to
# by redeploying its tag, and a manifest that pins <tag> keeps working when
# newer releases appear.
#
# The tag is also the only thing that used to decide the published reference:
# nothing compared it with the image the manifests pin, so pushing v0.2.0 from
# a tree that still pinned v0.1.0 published ghcr.io/...:v0.2.0 that no manifest
# in the repository deploys, and a tag pushed from a commit that never merged
# skipped CI entirely. Two gates therefore run before the build: the tagged
# commit must be reachable from main (a release is cut from merged code), and
# the tag must name exactly the release image every manifest pins
# (release_gate.sh, which CI's `go test` also covers).
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write
  # docker/build-push-action's documented permission set for pushing images
  # with provenance/SBOM attestations: the keyless signing and attestation
  # upload go through this workflow's OIDC identity, so without these the
  # attestation steps fail (or silently produce no attestations) on tag push.
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-publish:
    name: Build and publish release image
    runs-on: ubuntu-latest
    steps:
      # Full history, not a shallow tag checkout: the release gate below asks
      # whether the tagged commit is an ancestor of main, which a depth-1 clone
      # cannot answer.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Compute lowercase image name
        id: image
        shell: bash
        run: |
          lowercase=$(echo "${{ env.IMAGE }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${lowercase}" >> "$GITHUB_OUTPUT"

      # Restricting the trigger to main-reachable tags: a tag pushed from a
      # branch that never merged bypasses CI, so the commit it points at was
      # never built or tested against main. The push event carries no branch
      # filter for tags, so the ancestry is checked here, before the build.
      - name: Verify tag is reachable from main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "tag ${GITHUB_REF_NAME} is not reachable from main: cut releases from a commit that is merged to main, so the published image is the one CI tested" >&2
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} is on main"

      # The tag decides what is published, so it must name the image the
      # manifests deploy. main_test.go's releaseImage is held to the manifests
      # by TestManifestsPinVersionedReleaseImage (run by the Test step above),
      # so comparing the tag with the manifest pin also holds it to
      # releaseImage.
      - name: Verify tag matches the pinned release image
        run: |
          sh release_gate.sh "${GITHUB_REF_NAME}" "${{ steps.image.outputs.image }}"

      # The tag checkout is a detached HEAD; the build-arg feeds both the
      # binary's --version output and the image's OCI version label.
      - name: Build image
        run: |
          version="${GITHUB_REF_NAME}"
          docker build --build-arg VERSION="$version" -t "${{ steps.image.outputs.image }}:$version" .

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image with provenance and SBOM attestations
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ github.ref_name }}

      - name: Report digest and attestations in step summary
        run: |
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          # Prove the attestations landed: buildx imagetools inspect shows the
          # index entries for the provenance and SBOM attestation manifests.
          docker buildx imagetools inspect "${{ steps.image.outputs.image }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY" 2>&1
          echo '```' >> "$GITHUB_STEP_SUMMARY"
