name: Release

# Publishing path for release_hygiene: a vX.Y.Z tag is the single trigger. The
# workflow runs the same tests as CI, builds one image stamped with the tag
# version, and pushes exactly one immutable reference:
# <registry>/<image>:<tag>. Nothing floating like :latest is ever pushed, so
# an image reference stays point-in-time: an old release can be rolled back to
# by redeploying its tag, and a manifest that pins <tag> keeps working when
# newer releases appear.
#
# The tag is the only source of the version and of the published reference, so
# two gates run before anything is built or published:
#
#   - the tag must equal the tag of the reference the repository pins
#     (main_test.go's `releaseImage`, which the example manifests deploy), so a
#     v0.2.0 tag pushed while the pin still said v0.1.0 cannot publish
#     ghcr.io/<image>:v0.2.0 that no manifest references. vet plus the whole
#     test suite cannot catch that on their own: the pin is self-consistent, so
#     TestManifestsPinVersionedReleaseImage stayed green.
#   - the tagged commit must be reachable from main. Actions has no branch
#     filter for tag pushes, and a tag pushed from a branch that never merged
#     starts no pull request check at all, so the ancestry check is what keeps
#     such a commit from releasing.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write
  # docker/build-push-action's documented permission set for pushing images
  # with provenance/SBOM attestations: the keyless signing and attestation
  # upload go through this workflow's OIDC identity, so without these the
  # attestation steps fail (or silently produce no attestations) on tag push.
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-publish:
    name: Build and publish release image
    runs-on: ubuntu-latest
    steps:
      # Full history: the gate below proves the tagged commit is an ancestor of
      # main, and `git merge-base --is-ancestor` cannot answer that on the
      # default shallow (depth 1) tag checkout.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # First gate, before any toolchain setup or build: the release publishes
      # `${{ env.IMAGE }}:${GITHUB_REF_NAME}`, so the tag has to be the tag of
      # the image the repository pins.
      - name: Verify the tag matches the pinned release image
        shell: bash
        run: |
          set -u
          tag="${GITHUB_REF_NAME}"
          image="${IMAGE:-<registry>/<image>}"
          pinned=$(sed -n 's/^const releaseImage = "\([^"]*\)"$/\1/p' main_test.go)
          if [ -z "$pinned" ]; then
            echo "main_test.go declares no 'const releaseImage = \"...\"' line, so the release tag cannot be compared with the image the manifests pin" >&2
            exit 1
          fi
          pinned_tag="${pinned##*:}"
          echo "tag: ${tag}, pinned release image: ${pinned}"

          if [ "$tag" != "$pinned_tag" ]; then
            echo "tag ${tag} is not the tag of the pinned release image ${pinned}: bump releaseImage and the manifests in one change before tagging, otherwise this release publishes ${image}:${tag}, which no manifest in the repository references" >&2
            exit 1
          fi

          # The pin only names the release if the manifests deploy it: every
          # sidecar image reference under manifests/ must be that reference, so
          # a manifest left on the previous tag fails the release too.
          refs=$(grep -rhoE 'image:[[:space:]]+[^[:space:]]*redis-master-label[^[:space:]]*' manifests/ | sed -E 's/^image:[[:space:]]+//' | sort -u || true)
          if [ -z "$refs" ]; then
            echo "no redis-master-label image reference found under manifests/, so no manifest documents the image this release publishes" >&2
            exit 1
          fi
          if [ "$refs" != "$pinned" ]; then
            printf 'manifests/ pins:\n%s\nbut releaseImage is %s: bump the manifests and the pin in one change before tagging\n' "$refs" "$pinned" >&2
            exit 1
          fi

      # Second gate: a tag can be pushed from any commit, and such a commit
      # never went through a pull request check. Only a commit main contains may
      # release.
      - name: Verify the tag is reachable from main
        shell: bash
        run: |
          set -u
          base=refs/remotes/origin/main
          git fetch --no-tags origin "+refs/heads/main:${base}"
          if ! git merge-base --is-ancestor HEAD "$base"; then
            echo "tag ${GITHUB_REF_NAME} points at $(git rev-parse --short HEAD), which is not an ancestor of origin/main: refusing to release a commit that never merged" >&2
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Compute lowercase image name
        id: image
        shell: bash
        run: |
          lowercase=$(echo "${{ env.IMAGE }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${lowercase}" >> "$GITHUB_OUTPUT"

      # The tag checkout is a detached HEAD; the build-arg feeds both the
      # binary's --version output and the image's OCI version label.
      - name: Build image
        run: |
          version="${GITHUB_REF_NAME}"
          docker build --build-arg VERSION="$version" -t "${{ steps.image.outputs.image }}:$version" .

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image with provenance and SBOM attestations
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ github.ref_name }}

      - name: Report digest and attestations in step summary
        run: |
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          # Prove the attestations landed: buildx imagetools inspect shows the
          # index entries for the provenance and SBOM attestation manifests.
          docker buildx imagetools inspect "${{ steps.image.outputs.image }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY" 2>&1
          echo '```' >> "$GITHUB_STEP_SUMMARY"
