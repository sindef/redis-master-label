name: Release

# Publishing path for release_hygiene: a vX.Y.Z tag is the single trigger. The
# workflow runs the same tests as CI, builds one image stamped with the tag
# version, and pushes exactly one immutable reference:
# <registry>/<image>:<tag>. Nothing floating like :latest is ever pushed, so
# an image reference stays point-in-time: an old release can be rolled back to
# by redeploying its tag, and a manifest that pins <tag> keeps working when
# newer releases appear.
#
# GitHub matches push.tags against the tag name alone, so a tag pushed from a
# commit that never merged selects this workflow exactly like a real release.
# The trigger stays 'v*.*.*'; the first steps after checkout decide whether the
# tag may be released at all:
#
#   1. the tagged commit must be reachable from main, so no release is published
#      from a revision main never held, and
#   2. the tag must be the one the repository deploys: the pinned reference in
#      main_test.go (releaseImage, which TestManifestsPinVersionedReleaseImage
#      enforces against manifests/) must end in <tag>, and a manifest must
#      reference it.
#
# Both gates run before anything is built or pushed, so a tag that disagrees
# with the pin fails the run instead of publishing an image no manifest
# references. workflow_check.go's release tag gate check
# (main_test.go: TestReleaseWorkflowGatesTagOnPinnedReleaseImage) fails the
# pull request when either gate is dropped or moved after the build.
#
# The image is built once (release_hygiene): docker/build-push-action loads its
# output into the runner's Docker daemon, the job verifies that local image, and
# a plain `docker push` of the same tag publishes it. A second build would pay
# for the build twice and, because base-image digests and module downloads are
# not reproducible across runs, publish an artifact the run never ran or
# inspected. workflow_check.go's release single-build check (main_test.go:
# TestReleaseWorkflowBuildsImageOnce) fails the pull request when a release
# workflow builds the image again instead of pushing the build it verified.
#
# The built image is verified before it is published: the release job runs the
# image with --version and inspects its OCI labels, the same assertions CI's
# "Verify image version output", "Verify image OCI labels" and "Verify image
# license metadata" steps make on a pull request. Those checks live in CI only,
# and no Go test can see a built image (the build-file readers in
# dockerfile_check.go read the file, not the image), so without these steps a
# build file that strips the VERSION stamp or moves a LABEL into the discarded
# builder stage would pass review and reach GHCR on the tag push.
# workflow_check.go's release image verification check (main_test.go:
# TestReleaseWorkflowVerifiesImageBeforePush) fails the pull request when they
# are dropped or moved after the push.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-publish:
    name: Build and publish release image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The reachability gate below asks whether the tagged commit is an
          # ancestor of main. A shallow checkout holds neither main nor the
          # history between the two, so the answer would be unreadable.
          fetch-depth: 0

      # A tag push is not evidence of a release: a tag on a commit that never
      # merged still triggers this workflow. Only a commit main holds may be
      # released, because only that commit is what a redeploy of main would run.
      - name: Verify tag is reachable from main
        shell: bash
        run: |
          set -euo pipefail
          tag_commit=$(git rev-parse HEAD)
          git fetch --no-tags origin main
          if git merge-base --is-ancestor "$tag_commit" FETCH_HEAD; then
            echo "tag ${GITHUB_REF_NAME} points at $tag_commit, which is reachable from main"
          else
            echo "tag ${GITHUB_REF_NAME} points at $tag_commit, which is not reachable from main: release only a commit main holds" >&2
            exit 1
          fi

      # The published tag is ${GITHUB_REF_NAME} and nothing else, so it has to be
      # the tag the repository deploys. releaseImage in main_test.go is that pin
      # (TestManifestsPinVersionedReleaseImage holds manifests/ to it), so a tag
      # pushed without the matching bump - or a bump tagged with a different
      # version - stops here instead of publishing an image no manifest runs.
      - name: Verify tag matches the pinned release image
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          pinned=$(sed -n 's/^const releaseImage = "\(.*\)"$/\1/p' main_test.go)
          [ -n "$pinned" ] || { echo "main_test.go declares no releaseImage constant, so tag $tag cannot be compared with the image the manifests pin" >&2; exit 1; }
          pinned_tag="${pinned##*:}"
          if [ "$pinned_tag" != "$tag" ]; then
            echo "tag $tag does not match the pinned release image $pinned (pinned tag $pinned_tag): bump releaseImage and the manifests to $tag, merge that, and tag that commit" >&2
            exit 1
          fi

          # The pin only means something if the manifests deploy it: a constant
          # no manifest references keeps every test green while <tag> is an image
          # nothing deploys.
          if ! grep -rqF -- "$pinned" manifests/; then
            echo "no manifest under manifests/ references the pinned release image $pinned, so tag $tag would publish an image nothing deploys" >&2
            exit 1
          fi
          echo "tag $tag matches the pinned release image $pinned"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Compute lowercase image name
        id: image
        shell: bash
        run: |
          lowercase=$(echo "${{ env.IMAGE }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${lowercase}" >> "$GITHUB_OUTPUT"

      # The single image build of this release. The output is loaded into the
      # runner's Docker daemon, so the checks below run on exactly the image the
      # publish step pushes: no second build can swap in a different artifact.
      # The tag checkout is a detached HEAD; the build-arg feeds both the
      # binary's --version output and the image's OCI version label.
      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ${{ steps.image.outputs.image }}:${{ github.ref_name }}

      # A tag push is the only trigger, so a release-file regression is
      # discovered mid-release unless the built image is checked first. These
      # three steps make the same assertions CI makes on a pull request, on the
      # image this run is about to publish: the binary must report the tag, the
      # five OCI labels must be present and non-empty on the shipping image, the
      # version label must be the tag, and the license label must match LICENSE.
      # They run before anything is pushed, so a build file that strips the
      # VERSION stamp or keeps a LABEL in the discarded builder stage fails the
      # tag push instead of reaching GHCR.
      - name: Verify image version output
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          image="${{ steps.image.outputs.image }}:$version"
          got=$(docker run --rm "$image" --version)
          want="redis-master-label $version"
          if [ "$got" != "$want" ]; then
            echo "release image $image must report '$want', got '$got': --build-arg VERSION=$version must reach the linker stamp, so the build step has to pass it to -X main.version" >&2
            exit 1
          fi
          echo "$image reports '$got'"

      - name: Verify image OCI labels
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          image="${{ steps.image.outputs.image }}:$version"
          labels=$(docker inspect --format '{{json .Config.Labels}}' "$image")
          for key in title description source licenses version; do
            if ! printf '%s' "$labels" | grep -q "\"org.opencontainers.image.$key\":\"[^\"]"; then
              echo "release image $image declares no non-empty org.opencontainers.image.$key label (is the LABEL in the final stage?): $labels" >&2
              exit 1
            fi
          done
          got=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image")
          if [ "$got" != "$version" ]; then
            echo "org.opencontainers.image.version = '$got' on $image, want '$version': --build-arg VERSION must reach the label, which needs ARG VERSION in the final stage" >&2
            exit 1
          fi
          echo "$image carries the five OCI labels, version $got"

      - name: Verify image license metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          image="${{ steps.image.outputs.image }}:$version"
          test -f LICENSE || { echo "LICENSE missing: the image advertises a license the repository does not grant" >&2; exit 1; }
          grep -q 'Permission is hereby granted, free of charge' LICENSE || { echo "LICENSE does not contain the MIT permission text" >&2; exit 1; }
          got=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' "$image")
          if [ "$got" != MIT ]; then
            echo "org.opencontainers.image.licenses = '$got' on $image, want MIT (is the LABEL in the final stage?)" >&2
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish the image this job built and verified. `docker push` uploads
      # that image as-is: there is no second build here, so the pushed
      # reference is the artifact the checks above ran against.
      - name: Publish the built image
        id: push
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          image="${{ steps.image.outputs.image }}:$version"
          log="${RUNNER_TEMP:-/tmp}/docker-push.log"
          docker push "$image" | tee "$log"
          digest=$(awk '/^digest: /{print $2; exit}' "$log")
          if [ -z "$digest" ]; then
            echo "docker push reported no digest for $image, so the release cannot name the image it published" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "published $image@$digest"

      - name: Report pushed digest in step summary
        run: |
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          # Show what landed in the registry for that digest.
          docker buildx imagetools inspect "${{ steps.image.outputs.image }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY" 2>&1
          echo '```' >> "$GITHUB_STEP_SUMMARY"
