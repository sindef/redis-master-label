name: Release

# Cutting a release is: push a vX.Y.Z tag. This workflow tests the tagged
# source, builds the image from Dockerfile with the tag stamped into the
# binary and OCI labels, and publishes it to GHCR as
# ghcr.io/<owner>/redis-master-label:vX.Y.Z. The example manifests in
# manifests/ pin that same registry-qualified tag; when a new version is
# cut, bump the image tag in both manifests in the same release.
on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

permissions:
  contents: read

jobs:
  publish-image:
    name: Build and publish image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      # GHCR image names must be lowercase; GITHUB_REPOSITORY may not be.
      - name: Resolve image name
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # The image is the release artifact: never publish an untested tag.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag the image exactly with the pushed tag (vX.Y.Z). No :latest and no
      # other floating tag: the released image must stay addressable and
      # roll-back-able, matching the manifests.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          flavor: latest=false
          tags: type=ref,event=tag

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Report published digest
        run: |
          {
            echo "Published image: \`$IMAGE:$TAG\`"
            echo "Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.push.outputs.digest }}
