name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Build and test (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Test (race)
        run: CGO_ENABLED=1 go test -race -count=1 ./...

      # Sole dependency gate. Each command catches a different failure:
      # `go mod tidy -diff` fails on a stale go.mod/go.sum (missing or extra
      # requirements, drift in indirect markers); `go mod verify` fails when a
      # downloaded module does not match its go.sum hash; `git diff` proves the
      # two files were not silently rewritten by the commands above.
      - name: Check Go module files
        run: |
          go mod tidy -diff
          go mod verify
          git diff --exit-code -- go.mod go.sum

      - name: Validate manifests
        run: |
          docker run --rm -v "$PWD":/workdir ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary /workdir/manifests

      # The image is deployable output: both example manifests run the binary
      # the build file produces, so a broken or stale build file must fail the
      # pull request instead of being found when the image is built by hand.
      - name: Build container image
        run: |
          build_file=Containerfile
          [ -f "$build_file" ] || build_file=Dockerfile
          docker build -t ci-check:test -f "$build_file" .
