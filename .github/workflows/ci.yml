name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Build and test (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One toolchain declaration only, and it is go.mod's. setup-go honours a
      # single version source: with both go-version and go-version-file set it
      # warns that it ignores the file, so an explicit pin here silently decides
      # the toolchain, drifts from go.mod, and lets GOTOOLCHAIN=auto download a
      # second toolchain for the build. Reading go.mod keeps this job and
      # release.yml (go-version-file only) on the same version.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The toolchain that runs gofmt, vet, build and test must be the one
      # go.mod declares. GOTOOLCHAIN=local reads the toolchain the job actually
      # installed instead of a downloaded one: under the default `auto` an older
      # installed Go would fetch the go.mod toolchain and this check would pass
      # while the version printed in the log is a version no installed Go has.
      - name: Check Go toolchain
        run: |
          want=$(grep -E '^go [0-9]+\.[0-9]+' go.mod | head -n 1 | cut -d' ' -f2)
          [ -n "$want" ] || { echo "go.mod declares no go directive" >&2; exit 1; }
          got=$(GOTOOLCHAIN=local go version)
          echo "$got (go.mod declares go $want)"
          want_minor=$(printf '%s' "$want" | cut -d. -f1,2)
          got_minor=$(printf '%s' "$got" | sed -E 's/^go version go([0-9]+\.[0-9]+).*$/\1/')
          if [ "$got_minor" != "$want_minor" ]; then
            echo "installed toolchain is not the go.mod toolchain: $got, want go${want_minor}.x (setup-go must read go-version-file: go.mod)" >&2
            exit 1
          fi

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      # The workflow files are configuration this job depends on, so they get a
      # check of their own. It is an offline script rather than a YAML library
      # because no job installs one and these two files are small enough to scan
      # with regexes; the script prints a FAIL line and exits 1 for a tab
      # character, a block-scalar body at the wrong depth, a setup-go step
      # without `go-version-file: go.mod` (or with a second `go-version` pin,
      # whichever @vN the action carries) and a leftover GC-inspection token.
      # TestWorkflowsInvokeCiCheckComments fails the pull request when this step
      # is dropped, so the script cannot become an orphan again.
      - name: Verify TestYamlBlockIndents
        run: python3 ci_check_comments.py

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Test (race)
        run: CGO_ENABLED=1 go test -race -count=1 ./...

      # Sole dependency-graph gate. `go mod tidy -diff` prints the required
      # changes and exits non-zero when go.mod or go.sum is stale (a requirement
      # missing, extra, or carrying the wrong `// indirect` marker), so a stale
      # go.sum entry fails this pull request instead of only breaking a later
      # build. `go mod verify` then re-hashes the downloaded modules against
      # go.sum and fails on a mismatch. The final `git diff` proves the two
      # commands above left go.mod and go.sum byte-identical, so the gate never
      # passes by silently rewriting them.
      - name: Check Go module files
        run: |
          go mod tidy -diff
          go mod verify
          git diff --exit-code -- go.mod go.sum

      # The module graph must be producible from go.mod/go.sum alone: this walks
      # every module the build resolves and prints the JSON graph (discarded
      # here; `-e` reports a module that cannot be loaded instead of failing).
      # The `update-go_modules-graph` job below runs the same graph inside a job
      # of its own, because that job name is the status check branch protection
      # waits for.
      - name: Export Go modules graph
        run: go list -m -json -e all > /dev/null

      - name: Validate manifests
        run: |
          docker run --rm -v "$PWD":/workdir ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary /workdir/manifests

      # The builder stage compiles the binary the published image runs, so its
      # base image must carry the same Go MAJOR.MINOR as go.mod's `go` directive -
      # the version setup-go installs above and the one gofmt, vet, build and
      # test run on. The reviewed drift was `FROM golang:1.27-alpine` beside
      # `go 1.26.0`: a green pull request tested on 1.26.0 while the release
      # image was built by 1.27, and nothing compared the two files (Dependabot
      # bumps the tag on its own schedule). Bumping either one alone fails here.
      - name: Check builder toolchain matches go.mod
        run: |
          build_file=Dockerfile
          [ -f "$build_file" ] || build_file=Containerfile

          want=$(grep -E '^go [0-9]+\.[0-9]+' go.mod | head -n 1 | cut -d' ' -f2)
          [ -n "$want" ] || { echo "go.mod declares no go directive" >&2; exit 1; }
          want_minor=$(printf '%s' "$want" | cut -d. -f1,2)

          line=$(grep -iE '^[[:space:]]*FROM([[:space:]]+--[^[:space:]]+)*[[:space:]]+golang:' "$build_file" | head -n 1)
          [ -n "$line" ] || { echo "$build_file: no 'FROM golang:<tag>' builder stage found, so the toolchain compiling the binary cannot be read" >&2; exit 1; }
          tag=$(printf '%s' "$line" | sed -E 's/^.*golang:([^[:space:]]+).*$/\1/')
          got_minor=$(printf '%s' "$tag" | sed -E 's/^v?([0-9]+\.[0-9]+).*$/\1/')
          echo "$build_file builds with golang:$tag (go.mod declares go $want)"
          if [ "$got_minor" != "$want_minor" ]; then
            echo "$build_file: builder base image golang:$tag compiles the release binary with Go ${got_minor}.x, but go.mod declares go $want: bump the tag and the directive in the same change" >&2
            exit 1
          fi

      # The image is deployable output: both example manifests run the binary
      # the build file produces, so a broken or stale build file must fail the
      # pull request instead of being found when the image is built by hand.
      - name: Build container image
        run: |
          build_file=Dockerfile
          [ -f "$build_file" ] || build_file=Containerfile
          # The build file must compile the same source set as CI
          # (`go build ./...`) and the README (`go build -o redis-master-label .`).
          # Naming .go files on the COPY or `go build` line excludes every other
          # file in package main, so the image would ship a different program.
          if ! grep -Eqi '^[[:space:]]*copy[[:space:]]+(\*\.go|\.)[[:space:]]+[./]' "$build_file"; then
            echo "$build_file: builder stage must copy the package sources (COPY *.go ./ or COPY . .)" >&2
            exit 1
          fi
          build_cmd=$(grep -Ei '^[[:space:]]*run.*go build' "$build_file" || true)
          case "$build_cmd" in
            *' .')
              ;;
            *)
              echo "$build_file: go build must target the package ('.'), not named files: ${build_cmd:-<no go build step found>}" >&2
              exit 1
              ;;
          esac
          docker build -t ci-check:test -f "$build_file" .

      # The version the image reports is documented behavior (README: an
      # unstamped build reports `dev`, a release reports its tag), and `go test`
      # cannot see a regression here because tests compile without the linker
      # stamp. So run the built image: no --build-arg VERSION must print
      # "redis-master-label dev" rather than an empty version, and
      # --build-arg VERSION=v9.9.9 must print exactly that tag.
      - name: Verify image version output
        run: |
          build_file=Dockerfile
          [ -f "$build_file" ] || build_file=Containerfile

          docker build -t ci-check:unstamped -f "$build_file" .
          got=$(docker run --rm ci-check:unstamped --version)
          want="redis-master-label dev"
          if [ "$got" != "$want" ]; then
            echo "image built with no --build-arg VERSION must report '$want', got '$got'" >&2
            exit 1
          fi

          tag=v9.9.9
          docker build --build-arg VERSION="$tag" -t ci-check:stamped -f "$build_file" .
          got=$(docker run --rm ci-check:stamped --version)
          want="redis-master-label $tag"
          if [ "$got" != "$want" ]; then
            echo "image built with --build-arg VERSION=$tag must report '$want', got '$got'" >&2
            exit 1
          fi

      # The image metadata must survive into the image users pull. A LABEL block
      # in the builder stage reads the same in the build file yet is discarded
      # with that stage, and build args do not cross stage boundaries either, so
      # a version label whose VERSION argument was left in the builder stage
      # ships an image nobody can identify. Inspect the labels of an image built
      # with a known VERSION: every expected label must be present and
      # non-empty, and the version must be the build arg.
      - name: Verify image OCI labels
        run: |
          build_file=Dockerfile
          [ -f "$build_file" ] || build_file=Containerfile

          tag=v3.2.1
          docker build --build-arg VERSION="$tag" -t ci-check:labels -f "$build_file" .
          labels=$(docker inspect --format '{{json .Config.Labels}}' ci-check:labels)
          for key in title description source licenses version; do
            if ! printf '%s' "$labels" | grep -q "\"org.opencontainers.image.$key\":\"[^\"]"; then
              echo "shipping image declares no non-empty org.opencontainers.image.$key label (is the LABEL in the final stage?): $labels" >&2
              exit 1
            fi
          done

          got=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' ci-check:labels)
          if [ "$got" != "$tag" ]; then
            echo "org.opencontainers.image.version = '$got', want '$tag': --build-arg VERSION must reach the label, which needs ARG VERSION in the final stage" >&2
            exit 1
          fi

      # The published image must grant the license it advertises: the label
      # value comes from the served image rather than a grep of the build file,
      # because a LABEL in the discarded builder stage parses the same in the
      # file yet never reaches the image (the reviewed defect: the label claimed
      # MIT while the repository shipped no LICENSE file at all).
      - name: Verify image license metadata
        run: |
          test -f LICENSE || { echo "LICENSE missing: the image advertises a license the repository does not grant" >&2; exit 1; }
          grep -q 'Permission is hereby granted, free of charge' LICENSE || { echo "LICENSE does not contain the MIT permission text" >&2; exit 1; }
          grep -q 'LICENSE' README.md || { echo "README does not point at the LICENSE file" >&2; exit 1; }

          # ci-check:unstamped is the image built by "Verify image version output".
          got=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' ci-check:unstamped)
          want=MIT
          if [ "$got" != "$want" ]; then
            echo "org.opencontainers.image.licenses = '$got' on the shipping image, want '$want' (is the LABEL in the final stage?)" >&2
            exit 1
          fi

  # GitHub keys a required status check on the name of the job that reported it,
  # not on the steps that did the work, and branch protection requires the
  # `update-go_modules-graph` check here. So the module-graph gate keeps a job of
  # its own: it previously lived inside another job, and folding the workflow's
  # jobs together kept running the same commands while the required context
  # stopped reporting, leaving every pull request waiting on a check that could
  # no longer arrive. The job rebuilds the graph from go.mod/go.sum and fails
  # when the graph cannot be produced (for example when go.sum is missing an
  # entry). TestWorkflowsReportModuleGraphCheck fails the pull request when this
  # job is dropped, renamed or left without its graph commands.
  update-go_modules-graph:
    name: update-go_modules-graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Update go_modules graph
        run: |
          go mod graph > go_modules_graph.txt
          test -s go_modules_graph.txt
