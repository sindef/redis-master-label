name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Build and test (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: CGO_ENABLED=1 go test -race -count=1 ./...

      - name: Validate manifests
        run: |
          docker run --rm -v "$PWD":/workdir ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary /workdir/manifests

  # Dependency-tooling job recorded for this repository. It exports the module
  # graph on every pull request and on main: the JSON form is consumed by
  # dependency tooling, the plain-text form is the module list diffed between
  # revisions. The job name must stay `update-go_modules-graph` so the recorded
  # check keeps reporting.
  update-go_modules-graph:
    name: update-go_modules-graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          go-version-file: go.mod

      - name: update-go_modules-graph
        run: |
          go list -m -json -e all > go-modules-graph.json
          go list -m -e -f '{{.Path}} {{.Version}}' all > go-modules-graph.txt
          echo "Exported module graph: $(wc -l < go-modules-graph.json) JSON lines, $(wc -l < go-modules-graph.txt) modules"

      - name: Upload Go modules graph
        uses: actions/upload-artifact@v4
        with:
          name: go-modules-graph
          path: |
            go-modules-graph.json
            go-modules-graph.txt
          if-no-files-found: error
